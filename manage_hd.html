<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen User HD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between bg-slate-900 text-white p-5 rounded-2xl shadow-md">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold">Manajemen User HD</h1>
          <p class="text-xs text-slate-400">Tambah dan kelola akun Petugas Helpdesk</p>
        </div>
      </div>
      <a href="dashboard_hd.html" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
        <i class="fa-solid fa-chart-line"></i> Buka Dashboard
      </a>
    </div>

    <!-- FORM INPUT USER -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-indigo-600"></i> Form Tambah User HD Baru
      </h2>

      <form id="user-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">NIK HD</label>
          <input type="text" id="nik-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-xs transition" placeholder="Contoh: HD001">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Petugas HD</label>
          <input type="text" id="nama-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-xs transition" placeholder="Contoh: Ahmad Rizki">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="password-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-xs transition" placeholder="••••••••">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Segmen / Unit</label>
          <select id="segmen-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-xs transition">
            <option value="">-- Pilih Segmen --</option>
            <option value="DPE">DPE</option>
            <option value="DES">DES</option>
            <option value="DGS">DGS</option>
            <option value="DBS">DBS</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">ID Telegram (Opsional)</label>
          <input type="text" id="telegram-hd" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-xs transition" placeholder="Contoh: 123456789">
        </div>

        <div class="md:col-span-2 pt-2">
          <button type="submit" id="btn-submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-lg text-xs shadow transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> Simpan User HD
          </button>
        </div>
      </form>
    </div>

    <!-- TABEL DAFTAR USER -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-600"></i> Daftar Akun HD Terdaftar
        </h3>
        <span id="total-users" class="px-2 py-0.5 bg-indigo-100 text-indigo-700 font-bold rounded-full text-[10px]">Total: 0</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-100 text-slate-700 font-bold uppercase text-[10px]">
            <tr>
              <th class="p-3">NIK</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Segmen</th>
              <th class="p-3">ID Telegram</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="user-table-body" class="divide-y divide-slate-100">
            <!-- Data user dirender via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- SCRIPT LOGIKA MANAGE USER -->
  <script type="module" src="manage_hd.js"></script>
</body>
</html>
