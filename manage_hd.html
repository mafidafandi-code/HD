<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen User HD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between bg-slate-900 text-white p-5 rounded-2xl shadow-md">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold">Manajemen User HD</h1>
          <p class="text-xs text-slate-400">Kelola akun Petugas Helpdesk</p>
        </div>
      </div>
    </div>

    <!-- FORM INPUT USER -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-indigo-600"></i> Form Tambah User HD Baru
      </h2>

      <form id="user-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">NIK HD</label>
          <input type="text" id="nik-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-xs" placeholder="Contoh: HD001">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Petugas HD</label>
          <input type="text" id="nama-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-xs" placeholder="Contoh: Ahmad Rizki">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="password-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-xs" placeholder="••••••••">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Segmen / Unit</label>
          <select id="segmen-hd" required class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-xs">
            <option value="">-- Pilih Segmen --</option>
            <option value="DPE">DPE</option>
            <option value="DES">DES</option>
            <option value="DGS">DGS</option>
            <option value="DBS">DBS</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">ID Telegram (Opsional)</label>
          <input type="text" id="telegram-hd" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-xs" placeholder="Contoh: 123456789">
        </div>

        <div class="md:col-span-2 pt-2">
          <button type="submit" id="btn-submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> Simpan User HD
          </button>
        </div>
      </form>
    </div>

    <!-- TABEL DAFTAR USER -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <h3 class="text-xs font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-600"></i> Daftar Akun HD Terdaftar
        </h3>
        <span id="total-users" class="px-2 py-0.5 bg-indigo-100 text-indigo-700 font-bold rounded-full text-[10px]">Total: 0</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-100 text-slate-700 font-bold uppercase text-[10px]">
            <tr>
              <th class="p-3">NIK</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Segmen</th>
              <th class="p-3">ID Telegram</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="user-table-body" class="divide-y divide-slate-100">
            <!-- Data dirender dari API -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- SCRIPT UNTUK MEMANGGIL API SERVERLESS (VERCEL) -->
  <script>
    const userForm = document.getElementById('user-form');
    const tableBody = document.getElementById('user-table-body');
    const totalUsersBadge = document.getElementById('total-users');
    const btnSubmit = document.getElementById('btn-submit');

    // 1. GET ALL USERS DARI API /api/manage_hd
    async function loadUsers() {
      try {
        const res = await fetch('/api/manage_hd');
        if (!res.ok) throw new Error('Gagal mengambil data');
        const users = await res.json();

        tableBody.innerHTML = '';
        totalUsersBadge.textContent = `Total: ${users.length}`;

        if (users.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada user terdaftar.</td></tr>`;
          return;
        }

        users.forEach(user => {
          const row = document.createElement('tr');
          row.className = "hover:bg-slate-50 transition border-b border-slate-100";
          row.innerHTML = `
            <td class="p-3 font-semibold text-slate-800">${user.nik_hd || '-'}</td>
            <td class="p-3 font-medium text-slate-800">${user.nama_hd || '-'}</td>
            <td class="p-3">
              <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 font-bold rounded text-[10px] uppercase border border-indigo-200">
                ${user.segmen || '-'}
              </span>
            </td>
            <td class="p-3 font-mono text-[11px] text-slate-500">${user.id_telegram_hd || '-'}</td>
            <td class="p-3 text-center">
              <button onclick="deleteUser('${user.id}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-md text-[11px] font-semibold transition border border-rose-200">
                <i class="fa-solid fa-trash"></i> Hapus
              </button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-rose-500">Gagal memuat data user!</td></tr>`;
      }
    }

    // 2. TAMBAH USER BARU (POST)
    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        nik_hd: document.getElementById('nik-hd').value.trim(),
        nama_hd: document.getElementById('nama-hd').value.trim(),
        password: document.getElementById('password-hd').value.trim(),
        segmen: document.getElementById('segmen-hd').value,
        id_telegram_hd: document.getElementById('telegram-hd').value.trim() || null
      };

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

      try {
        const res = await fetch('/api/manage_hd', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Gagal menyimpan');

        alert('User HD Berhasil Ditambahkan!');
        userForm.reset();
        loadUsers();
      } catch (err) {
        console.error(err);
        alert('Terjadi kesalahan saat menyimpan data!');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan User HD`;
      }
    });

    // 3. HAPUS USER (DELETE)
    async function deleteUser(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus user ini?')) return;

      try {
        const res = await fetch(`/api/manage_hd?id=${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Gagal menghapus');

        alert('User berhasil dihapus!');
        loadUsers();
      } catch (err) {
        console.error(err);
        alert('Gagal menghapus user!');
      }
    }

    // Jalankan saat pertama kali dibuka
    loadUsers();
  </script>
</body>
</html>
