<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Data Permintaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800 p-6">
  <div class="max-w-6xl mx-auto">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6">
      <div>
        <h1 class="text-xl font-bold text-blue-600">Manajemen Data Permintaan</h1>
        <p class="text-xs text-gray-500">Tambah, Edit, & Hapus data Permintaan Layanan/Barang</p>
      </div>
      <div class="flex items-center space-x-2">
        <a href="/" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg font-medium border">⬅️ Kembali ke Portal</a>
        <button onclick="openModal()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-bold">+ Tambah Permintaan</button>
      </div>
    </div>

    <!-- Table Permintaan -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden border">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 border-b text-gray-600 font-semibold">
          <tr>
            <th class="p-3">Pemohon</th>
            <th class="p-3">Nama Permintaan</th>
            <th class="p-3">Jumlah</th>
            <th class="p-3">Status</th>
            <th class="p-3">Keterangan</th>
            <th class="p-3 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody id="request-table-body">
          <!-- Item permintaan dirender via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL FORM INPUT/EDIT -->
  <div id="request-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6">
      <h3 id="modal-title" class="text-lg font-bold mb-4 text-gray-800">Tambah Permintaan</h3>
      <form id="request-form" onsubmit="saveRequest(event)" class="space-y-3">
        <input type="hidden" id="form-id">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700">Nama Pemohon *</label>
            <input type="text" id="form-pemohon" required class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700">Nama Permintaan *</label>
            <input type="text" id="form-nama-permintaan" required class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700">Jumlah *</label>
            <input type="number" id="form-jumlah" min="1" required class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700">Status *</label>
            <select id="form-status" required class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
              <option value="PENDING">PENDING</option>
              <option value="DIPROSES">DIPROSES</option>
              <option value="DISETUJUI">DISETUJUI</option>
              <option value="DITOLAK">DITOLAK</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700">Keterangan</label>
          <textarea id="form-keterangan" rows="3" class="w-full p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Catatan tambahan..."></textarea>
        </div>

        <div class="flex justify-end space-x-2 pt-4">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm font-semibold text-gray-600">Batal</button>
          <button type="submit" id="save-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let requestsList = [];

    window.addEventListener('DOMContentLoaded', loadRequests);

    async function loadRequests() {
      try {
        const res = await fetch('/api/admin-crud');
        const data = await res.json();
        if (res.ok && data.success) {
          requestsList = data.requests || [];
          renderRequestTable();
        }
      } catch (e) {
        alert("Gagal memuat data permintaan");
      }
    }

    function getStatusBadge(status) {
      const styles = {
        'PENDING': 'bg-amber-100 text-amber-800 border-amber-200',
        'DIPROSES': 'bg-blue-100 text-blue-800 border-blue-200',
        'DISETUJUI': 'bg-green-100 text-green-800 border-green-200',
        'DITOLAK': 'bg-red-100 text-red-800 border-red-200'
      };
      return `<span class="${styles[status] || 'bg-gray-100 text-gray-800'} text-xs px-2 py-0.5 rounded font-bold border">${status}</span>`;
    }

    function renderRequestTable() {
      const tbody = document.getElementById('request-table-body');
      tbody.innerHTML = '';

      if (requestsList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Belum ada data permintaan.</td></tr>`;
        return;
      }

      requestsList.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-gray-50";

        tr.innerHTML = `
          <td class="p-3 font-semibold">${escapeHtml(item.pemohon)}</td>
          <td class="p-3">${escapeHtml(item.nama_permintaan)}</td>
          <td class="p-3 font-mono text-xs">${item.jumlah}</td>
          <td class="p-3">${getStatusBadge(item.status)}</td>
          <td class="p-3 text-xs text-gray-600">${escapeHtml(item.keterangan || '-')}</td>
          <td class="p-3 text-right space-x-1">
            <button onclick="editRequest('${item.id}')" class="text-xs bg-yellow-50 text-yellow-700 border border-yellow-200 px-2 py-1 rounded hover:bg-yellow-100">Edit</button>
            <button onclick="deleteRequest('${item.id}')" class="text-xs bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded hover:bg-red-100">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal() {
      document.getElementById('form-id').value = '';
      document.getElementById('request-form').reset();
      document.getElementById('modal-title').innerText = 'Tambah Permintaan';
      document.getElementById('request-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('request-modal').classList.add('hidden');
    }

    function editRequest(id) {
      const item = requestsList.find(x => x.id === id);
      if (!item) return;

      document.getElementById('form-id').value = item.id;
      document.getElementById('form-pemohon').value = item.pemohon;
      document.getElementById('form-nama-permintaan').value = item.nama_permintaan;
      document.getElementById('form-jumlah').value = item.jumlah;
      document.getElementById('form-status').value = item.status || 'PENDING';
      document.getElementById('form-keterangan').value = item.keterangan || '';

      document.getElementById('modal-title').innerText = 'Edit Permintaan';
      document.getElementById('request-modal').classList.remove('hidden');
    }

    async function saveRequest(e) {
      e.preventDefault();
      const id = document.getElementById('form-id').value;
      const payload = {
        id,
        pemohon: document.getElementById('form-pemohon').value,
        nama_permintaan: document.getElementById('form-nama-permintaan').value,
        jumlah: document.getElementById('form-jumlah').value,
        status: document.getElementById('form-status').value,
        keterangan: document.getElementById('form-keterangan').value
      };

      const btn = document.getElementById('save-btn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/admin-crud', {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.success) {
          closeModal();
          loadRequests();
        } else {
          alert(data.error || 'Gagal menyimpan permintaan');
        }
      } catch (err) {
        alert('Gagal mengirim data');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteRequest(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus permintaan ini?')) return;

      try {
        const res = await fetch(`/api/admin-crud?id=${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (res.ok && data.success) {
          loadRequests();
        } else {
          alert(data.error || 'Gagal menghapus permintaan');
        }
      } catch (err) {
        alert('Gagal menghapus permintaan');
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
